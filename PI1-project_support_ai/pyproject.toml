[project]
name = "support-ai-query"
version = "0.1.0"
description = "AI-powered support ticket assistant with prompt engineering and metrics"
authors = [{name = "AI Engineer", email = "student@course.com"}]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.3.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
